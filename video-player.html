<div class="no-select" id="video-player-container">
  <div class="video-modal" id="video-modal">
    <span class="modal-close" id="video-modal-close">&times;</span>
    <button class="modal-nav prev-modal" id="prev-trailer" aria-label="Previous trailer">&lt;</button>
    <button class="modal-nav next-modal" id="next-trailer" aria-label="Next trailer">&gt;</button>

    <div class="video-fullscreen-container" id="video-fullscreen-container">

      <div class="video-container">
        <video id="video-player" preload="metadata" playsinline></video>
        <div class="pause-icon-overlay" aria-hidden="true"><i class="fas fa-play"></i></div>

        <div class="video-end-overlay" id="video-end-overlay">
          <div class="video-end-overlay-content">
            <img class="video-end-overlay-cover" id="video-end-overlay-cover" src="" alt="Обложка игры">
            <p class="video-end-overlay-title" id="video-end-overlay-title">Название игры</p>
            <a class="video-end-overlay-button" id="video-end-overlay-button" href="#">К игре</a>
          </div>
        </div>
      </div>

      <div class="video-controls">
        <div class="timeline-group">
          <input type="range" id="progress-bar" class="progress-bar" value="0" step="any" min="0" max="1">
        </div>

        <div class="controls-bottom">
          <div class="control-group left-group">
            <button id="play-pause-btn" class="control-btn" aria-label="Play/Pause">
              <i class="fas fa-play"></i>
            </button>
          </div>

          <div class="control-group time-group">
            <div class="time-display combined-time">
              <span id="current-time">00:00</span>
              <span class="time-separator"> / </span>
              <span id="duration">00:00</span>
            </div>
          </div>

          <div class="control-group right-group">
            <div class="volume-group">
              <button id="mute-btn" class="control-btn" aria-label="Mute/Unmute">
                <i class="fas fa-volume-up"></i>
              </button>
              <input type="range" id="volume-bar" class="volume-bar" value="1" min="0" max="1" step="0.01">
            </div>
            <button id="fullscreen-btn" class="control-btn" aria-label="Fullscreen">
              <i class="fas fa-expand"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
